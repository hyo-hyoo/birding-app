<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>观鸟 Web App｜柔雾标本册</title>
  <style>
    :root {
      color-scheme: light;
      --mist: #f2f4ef;
      --paper: #fbfcf8;
      --moss-wash: #e0e8de;
      --blue-wash: #d3e0dc;
      --selection: #d6e4d6;
      --line: #c5d0c7;
      --ink: #284a3e;
      --body: #4c6258;
      --quiet: #788b83;
      --ginkgo: #c9a95f;
      --ginkgo-wash: #f0e5c9;
      --bird-yellow: #e8c864;
      --bird-blue: #7fa9b8;
      --bird-grey: #919995;
      --bird-green: #91aa87;
      --bird-brown: #9b745c;
      --bird-white: #f4f2ea;
      --bird-black: #3f4643;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--mist);
      color: var(--ink);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      margin: 0;
      background:
        radial-gradient(circle at 50% 5%, rgba(211, 224, 220, .8), transparent 28rem),
        var(--mist);
    }

    button { font: inherit; }

    .prototype-note {
      padding: 20px 24px 0;
      color: var(--quiet);
      font-size: 12px;
      letter-spacing: .06em;
      text-align: center;
    }

    .page {
      position: relative;
      width: min(100%, 420px);
      min-height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      background: var(--paper);
      box-shadow: 0 24px 60px rgba(55, 82, 68, .13);
    }

    .page::before {
      position: absolute;
      z-index: 0;
      top: 0;
      left: 27px;
      width: 1px;
      height: 100%;
      background: linear-gradient(to bottom, transparent, rgba(40, 74, 62, .13) 5%, rgba(40, 74, 62, .13) 90%, transparent);
      content: "";
    }

    .topbar,
    main,
    .save-dock { position: relative; z-index: 1; }

    .topbar {
      display: flex;
      min-height: 68px;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px 8px 48px;
    }

    .back {
      display: inline-flex;
      min-width: 44px;
      min-height: 44px;
      align-items: center;
      gap: 7px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 13px;
      cursor: pointer;
    }

    .back-mark { font-size: 19px; line-height: 1; }

    .draft {
      padding: 6px 9px;
      border: 1px solid rgba(40, 74, 62, .13);
      border-radius: 999px;
      color: var(--quiet);
      font-size: 11px;
      letter-spacing: .08em;
    }

    main { padding: 0 24px 132px 48px; }

    .intro { padding: 12px 0 24px; }

    .kicker {
      margin: 0 0 8px;
      color: var(--quiet);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
    }

    h1,
    h2 {
      font-family: ui-serif, "Songti SC", "STSong", "SimSun", serif;
      font-weight: 600;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: 28px;
      letter-spacing: .035em;
    }

    .intro-copy {
      max-width: 260px;
      margin: 9px 0 0;
      color: var(--body);
      font-size: 13px;
      line-height: 1.7;
    }

    .specimen {
      position: relative;
      min-height: 218px;
      padding: 18px 18px 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px 18px 40px 18px;
      background: linear-gradient(135deg, #f7faf5 0%, var(--moss-wash) 100%);
    }

    .specimen-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--quiet);
      font-size: 11px;
      letter-spacing: .08em;
    }

    .specimen-label strong { color: var(--ink); font-weight: 700; }

    .bird-svg {
      position: absolute;
      top: 35px;
      right: 18px;
      width: 280px;
      height: 174px;
    }

    .section { padding: 28px 0 0; }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    h2 { margin: 0; font-size: 18px; letter-spacing: .025em; }

    .section-note {
      margin: 0;
      color: var(--quiet);
      font-size: 11px;
      white-space: nowrap;
    }

    .body-parts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .part {
      min-height: 52px;
      padding: 8px 3px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
      color: var(--body);
      font-size: 12px;
      cursor: pointer;
    }

    .part::before {
      display: block;
      width: 6px;
      height: 6px;
      margin: 0 auto 5px;
      border-radius: 50%;
      background: #b9c5bd;
      content: "";
    }

    .part.is-set::before { background: var(--ink); }

    .part.is-active {
      border-color: transparent;
      background: var(--selection);
      box-shadow: inset 0 0 0 1px rgba(40, 74, 62, .12);
      color: var(--ink);
      font-weight: 700;
    }

    .part.is-active::before { background: var(--ginkgo); }

    .observation {
      position: relative;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 18px 18px 18px 6px;
      background: #f8faf6;
    }

    .observation::before {
      position: absolute;
      top: 18px;
      left: -12px;
      width: 12px;
      height: 1px;
      background: var(--line);
      content: "";
    }

    .field-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
      color: var(--body);
      font-size: 12px;
      font-weight: 700;
    }

    .field-label small {
      color: var(--quiet);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .03em;
    }

    .field-group + .field-group { margin-top: 22px; }

    .swatch-viewport {
      position: relative;
      margin: 0 -18px;
      overflow: hidden;
    }

    .swatch-viewport::after {
      position: absolute;
      top: 18px;
      right: 0;
      width: 28px;
      height: 60px;
      background: linear-gradient(to right, transparent, #f8faf6 88%);
      pointer-events: none;
      content: "";
    }

    .swatch-row {
      display: flex;
      gap: 14px;
      padding: 2px 26px 10px 18px;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      scrollbar-width: none;
      scroll-snap-type: x proximity;
    }

    .swatch-row::-webkit-scrollbar { display: none; }

    .swatch-item {
      display: grid;
      flex: 0 0 50px;
      grid-template-rows: 18px 50px;
      gap: 6px;
      justify-items: center;
      scroll-snap-align: start;
    }

    .swatch-name {
      color: var(--ink);
      font-size: 10px;
      font-weight: 700;
      opacity: 0;
      transform: translateY(2px);
      transition: opacity .16s ease, transform .16s ease;
      white-space: nowrap;
    }

    .swatch-item.is-selected .swatch-name {
      opacity: 1;
      transform: translateY(0);
    }

    .swatch-button {
      width: 46px;
      height: 46px;
      padding: 0;
      border: 1px solid rgba(40, 74, 62, .2);
      border-radius: 50%;
      background: var(--swatch);
      cursor: pointer;
      transition: box-shadow .16s ease, transform .16s ease;
    }

    .swatch-button[aria-pressed="true"] {
      border-color: var(--paper);
      box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--ginkgo), 0 0 0 7px rgba(40, 74, 62, .34);
      transform: scale(.94);
    }

    .choice-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .choice-chip {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      color: var(--body);
      font-size: 12px;
      cursor: pointer;
    }

    .choice-chip[aria-pressed="true"] {
      border-color: var(--ink);
      background: var(--selection);
      color: var(--ink);
      font-weight: 700;
    }

    .more-pattern { gap: 5px; }
    .more-pattern span { color: var(--quiet); font-size: 15px; }

    .certainty-row {
      display: grid;
      grid-template-columns: .8fr 1.2fr 1.25fr;
      gap: 8px;
    }

    .certainty-row .choice-chip { padding: 0 7px; }

    .pattern-dialog {
      width: min(100%, 420px);
      max-width: none;
      margin: auto auto 0;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 24px 24px 0 0;
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 -20px 60px rgba(24, 48, 40, .2);
    }

    .pattern-dialog::backdrop { background: rgba(31, 52, 44, .36); backdrop-filter: blur(2px); }

    .sheet-handle {
      width: 40px;
      height: 4px;
      margin: 10px auto 4px;
      border-radius: 999px;
      background: var(--line);
    }

    .sheet-content { padding: 14px 24px 28px; }

    .sheet-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .sheet-head h2 { margin-bottom: 5px; }

    .sheet-head p {
      margin: 0;
      color: var(--quiet);
      font-size: 11px;
      line-height: 1.5;
    }

    .sheet-close {
      display: grid;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--mist);
      color: var(--ink);
      font-size: 18px;
      cursor: pointer;
    }

    .sheet-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .sheet-option {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      color: var(--body);
      cursor: pointer;
    }

    .sheet-option[aria-pressed="true"] {
      border-color: var(--ink);
      background: var(--selection);
      color: var(--ink);
      font-weight: 700;
    }

    .summary {
      margin: 24px 0 0;
      padding: 16px 18px 16px 20px;
      border-left: 3px solid var(--ginkgo);
      background: var(--moss-wash);
      color: var(--body);
      font-size: 13px;
      line-height: 1.7;
    }

    .summary strong { color: var(--ink); font-weight: 700; }

    .save-dock {
      position: fixed;
      right: max(0px, calc((100vw - 420px) / 2));
      bottom: 0;
      left: max(0px, calc((100vw - 420px) / 2));
      padding: 12px 24px 20px 48px;
      border-top: 1px solid rgba(197, 208, 199, .8);
      background: rgba(251, 252, 248, .94);
      box-shadow: 0 -10px 25px rgba(55, 82, 68, .06);
      backdrop-filter: blur(10px);
    }

    .save-button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 14px;
      background: var(--ink);
      box-shadow: inset 0 1px rgba(255, 255, 255, .18), 0 8px 18px rgba(40, 74, 62, .18);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .03em;
      cursor: pointer;
    }

    button:focus-visible { outline: 3px solid rgba(201, 169, 95, .8); outline-offset: 2px; }

    @media (min-width: 421px) {
      .page { min-height: calc(100vh - 52px); margin-top: 16px; margin-bottom: 36px; border: 1px solid rgba(197, 208, 199, .72); border-radius: 24px; }
      .save-dock { bottom: 36px; }
      .pattern-dialog { margin-bottom: 36px; border-radius: 24px; }
    }

    @media (max-width: 380px) {
      .topbar { padding-left: 36px; }
      main { padding-left: 44px; }
      .save-dock { padding-left: 44px; }
      .body-parts { gap: 5px; }
    }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <p class="prototype-note">视觉实验 · B′ 柔雾标本册</p>

  <div class="page">
    <header class="topbar">
      <button class="back" type="button" aria-label="返回修改轮廓"><span class="back-mark">←</span>修改轮廓</button>
      <span class="draft">草稿</span>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="kicker">OBSERVATION NOTE</p>
        <h1 id="page-title">记录这只鸟</h1>
        <p class="intro-copy">只留下你看清的部分。模糊之处可以先不填。</p>
      </section>

      <section class="specimen" aria-label="当前选择的鸟类轮廓">
        <div class="specimen-label"><span>整体轮廓</span><strong>枝头鸟</strong></div>
        <svg class="bird-svg" viewBox="0 0 240 170" role="img" aria-label="抽象的枝头鸟轮廓">
          <path d="M24 136 C71 133 107 136 147 139 C177 142 199 142 222 136" fill="none" stroke="#70887d" stroke-width="4" stroke-linecap="round"/>
          <path d="M123 136 C112 118 116 102 126 91 C135 82 143 81 149 70 C157 54 151 36 168 26 C188 15 214 25 220 45 C223 56 217 66 207 71 C219 80 218 101 205 110 C192 119 179 119 168 117 C156 132 145 140 123 136Z" fill="#f4f7f1" stroke="#284a3e" stroke-width="3" stroke-linejoin="round"/>
          <path d="M167 62 C182 64 195 70 203 84 C190 88 177 94 163 105 C158 89 158 76 167 62Z" fill="#d3e0dc" stroke="#284a3e" stroke-width="2" stroke-linejoin="round"/>
          <path d="M167 91 C180 92 188 97 195 104" fill="none" stroke="#c9a95f" stroke-width="7" stroke-linecap="round"/>
          <path d="M218 48 L236 42 L221 57Z" fill="#c9a95f" stroke="#284a3e" stroke-width="2" stroke-linejoin="round"/>
          <circle cx="203" cy="42" r="3" fill="#284a3e"/>
          <path d="M151 117 C150 128 154 136 160 141 M161 117 C161 129 165 136 171 140" fill="none" stroke="#284a3e" stroke-width="3" stroke-linecap="round"/>
          <path d="M113 141 L107 151 M124 141 L119 151" fill="none" stroke="#284a3e" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </section>

      <section class="section" aria-labelledby="parts-title">
        <div class="section-head"><h2 id="parts-title">观察部位</h2><p class="section-note">已记录胸腹</p></div>
        <div class="body-parts">
          <button class="part" type="button">头部</button>
          <button class="part is-active" type="button" aria-pressed="true">胸腹</button>
          <button class="part is-set" type="button">翅膀</button>
          <button class="part" type="button">尾部</button>
        </div>
      </section>

      <section class="section" aria-labelledby="detail-title">
        <div class="section-head"><h2 id="detail-title">胸腹的印象</h2><p class="section-note">可随时跳过</p></div>
        <div class="observation">
          <div class="field-group">
            <span class="field-label">主颜色 <small>左右滑动查看更多</small></span>
            <div class="swatch-viewport">
              <div class="swatch-row" role="group" aria-label="选择胸腹主颜色">
                <div class="swatch-item is-selected">
                  <span class="swatch-name">黄色</span>
                  <button class="swatch-button" type="button" style="--swatch: var(--bird-yellow)" aria-label="黄色" aria-pressed="true" data-color="黄色"></button>
                </div>
                <div class="swatch-item">
                  <span class="swatch-name">蓝色</span>
                  <button class="swatch-button" type="button" style="--swatch: var(--bird-blue)" aria-label="蓝色" aria-pressed="false" data-color="蓝色"></button>
                </div>
                <div class="swatch-item">
                  <span class="swatch-name">灰色</span>
                  <button class="swatch-button" type="button" style="--swatch: var(--bird-grey)" aria-label="灰色" aria-pressed="false" data-color="灰色"></button>
                </div>
                <div class="swatch-item">
                  <span class="swatch-name">绿色</span>
                  <button class="swatch-button" type="button" style="--swatch: var(--bird-green)" aria-label="绿色" aria-pressed="false" data-color="绿色"></button>
                </div>
                <div class="swatch-item">
                  <span class="swatch-name">褐色</span>
                  <button class="swatch-button" type="button" style="--swatch: var(--bird-brown)" aria-label="褐色" aria-pressed="false" data-color="褐色"></button>
                </div>
                <div class="swatch-item">
                  <span class="swatch-name">白色</span>
                  <button class="swatch-button" type="button" style="--swatch: var(--bird-white)" aria-label="白色" aria-pressed="false" data-color="白色"></button>
                </div>
                <div class="swatch-item">
                  <span class="swatch-name">黑色</span>
                  <button class="swatch-button" type="button" style="--swatch: var(--bird-black)" aria-label="黑色" aria-pressed="false" data-color="黑色"></button>
                </div>
              </div>
            </div>
          </div>

          <div class="field-group">
            <span class="field-label">花纹 <small>示例选项</small></span>
            <div class="choice-row" role="group" aria-label="选择胸腹花纹">
              <button class="choice-chip" type="button" data-pattern="纯色" aria-pressed="false">纯色</button>
              <button class="choice-chip" type="button" data-pattern="细条纹" aria-pressed="true">细条纹</button>
              <button class="choice-chip" type="button" data-pattern="斑点" aria-pressed="false">斑点</button>
              <button class="choice-chip more-pattern" id="more-pattern" type="button" aria-haspopup="dialog"><b>更多</b><span>›</span></button>
            </div>
          </div>

          <div class="field-group">
            <span class="field-label">确定程度</span>
            <div class="certainty-row" role="group" aria-label="选择确定程度">
              <button class="choice-chip" type="button" data-certainty="确定" aria-pressed="false">确定</button>
              <button class="choice-chip" type="button" data-certainty="大概如此" aria-pressed="true">大概如此</button>
              <button class="choice-chip" type="button" data-certainty="非常模糊" aria-pressed="false">非常模糊</button>
            </div>
          </div>
        </div>
      </section>

      <p class="summary"><strong>当前印象</strong><br><span id="summary-text">胸腹为黄色，有细条纹；大概如此。</span></p>
    </main>

    <footer class="save-dock"><button class="save-button" type="button">保存这次观察</button></footer>
  </div>

  <dialog class="pattern-dialog" id="pattern-dialog" aria-labelledby="pattern-sheet-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-content">
      <div class="sheet-head">
        <div>
          <h2 id="pattern-sheet-title">选择花纹</h2>
          <p>这里先放入较多示例，用于确认选项增加后的观感。</p>
        </div>
        <button class="sheet-close" id="close-pattern" type="button" aria-label="关闭花纹选择">×</button>
      </div>
      <div class="sheet-options" role="group" aria-label="全部花纹选项">
        <button class="sheet-option" type="button" data-sheet-pattern="纯色" aria-pressed="false">纯色</button>
        <button class="sheet-option" type="button" data-sheet-pattern="细条纹" aria-pressed="true">细条纹</button>
        <button class="sheet-option" type="button" data-sheet-pattern="粗条纹" aria-pressed="false">粗条纹</button>
        <button class="sheet-option" type="button" data-sheet-pattern="斑点" aria-pressed="false">斑点</button>
        <button class="sheet-option" type="button" data-sheet-pattern="翼斑" aria-pressed="false">翼斑</button>
        <button class="sheet-option" type="button" data-sheet-pattern="眼纹" aria-pressed="false">眼纹</button>
        <button class="sheet-option" type="button" data-sheet-pattern="色块" aria-pressed="false">色块</button>
        <button class="sheet-option" type="button" data-sheet-pattern="其他" aria-pressed="false">其他</button>
      </div>
    </div>
  </dialog>

  <script>
    const swatchButtons = [...document.querySelectorAll('.swatch-button')];
    const quickPatternButtons = [...document.querySelectorAll('[data-pattern]')];
    const sheetPatternButtons = [...document.querySelectorAll('[data-sheet-pattern]')];
    const certaintyButtons = [...document.querySelectorAll('[data-certainty]')];
    const morePatternButton = document.querySelector('#more-pattern');
    const morePatternLabel = morePatternButton.querySelector('b');
    const patternDialog = document.querySelector('#pattern-dialog');
    const closePatternButton = document.querySelector('#close-pattern');
    const summaryText = document.querySelector('#summary-text');
    const quickPatternValues = quickPatternButtons.map((button) => button.dataset.pattern);

    let selectedColor = '黄色';
    let selectedPattern = '细条纹';
    let selectedCertainty = '大概如此';

    function refreshSummary() {
      const patternPhrase = selectedPattern === '纯色' ? '无明显花纹' : `有${selectedPattern}`;
      summaryText.textContent = `胸腹为${selectedColor}，${patternPhrase}；${selectedCertainty}。`;
    }

    swatchButtons.forEach((button) => {
      button.addEventListener('click', () => {
        selectedColor = button.dataset.color;
        swatchButtons.forEach((item) => {
          const isSelected = item === button;
          item.setAttribute('aria-pressed', String(isSelected));
          item.closest('.swatch-item').classList.toggle('is-selected', isSelected);
        });
        refreshSummary();
      });
    });

    function choosePattern(pattern) {
      selectedPattern = pattern;
      quickPatternButtons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.pattern === pattern)));
      sheetPatternButtons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.sheetPattern === pattern)));

      const isQuickPattern = quickPatternValues.includes(pattern);
      morePatternButton.setAttribute('aria-pressed', String(!isQuickPattern));
      morePatternLabel.textContent = isQuickPattern ? '更多' : pattern;
      refreshSummary();
    }

    quickPatternButtons.forEach((button) => button.addEventListener('click', () => choosePattern(button.dataset.pattern)));

    morePatternButton.addEventListener('click', () => patternDialog.showModal());
    closePatternButton.addEventListener('click', () => patternDialog.close());
    patternDialog.addEventListener('click', (event) => {
      if (event.target === patternDialog) patternDialog.close();
    });

    sheetPatternButtons.forEach((button) => {
      button.addEventListener('click', () => {
        choosePattern(button.dataset.sheetPattern);
        patternDialog.close();
      });
    });

    certaintyButtons.forEach((button) => {
      button.addEventListener('click', () => {
        selectedCertainty = button.dataset.certainty;
        certaintyButtons.forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
        refreshSummary();
      });
    });
  </script>
</body>
</html>
